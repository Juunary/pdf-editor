<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Editor</title>
    <link rel="stylesheet" href="./src/viewer/viewer.css" />
  </head>
  <body>
    <header id="toolbar">
      <label id="open-label" hidden>
        <span data-i18n="openPdf">PDF 열기</span>
        <input id="open-file" type="file" accept="application/pdf,.pdf" />
      </label>
      <div id="viewer-controls"></div>
      <div id="save-menu-wrap" class="menu-wrap">
        <button
          id="save-menu-button"
          type="button"
          disabled
          aria-label="저장"
          title="저장"
          data-i18n-aria-label="save"
          data-i18n-title="save"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="save-menu"
        >
          <svg
            viewBox="0 0 20 20"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5.5 7.5v-5h9v5" />
            <path
              d="M5.5 14.5h-2a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h13a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2"
            />
            <path d="M5.5 11.5h9v6h-9z" />
            <circle cx="14.5" cy="9.5" r="0.8" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <div id="save-menu" class="menu" role="menu" aria-labelledby="save-menu-button" hidden>
          <button id="save" type="button" role="menuitem" tabindex="-1">
            <span data-i18n="save">저장</span><span class="menu-key">Ctrl+S</span>
          </button>
          <button id="save-as" type="button" role="menuitem" tabindex="-1">
            <span data-i18n="saveAs">다른 이름으로 저장</span>
          </button>
          <button
            id="save-downloads"
            class="dev-only"
            type="button"
            role="menuitem"
            tabindex="-1"
            title="M0 진단: chrome.downloads 경로 강제(개발 빌드 전용)"
            data-i18n-title="saveDownloadsTitle"
          >
            <span data-i18n="saveDownloads">downloads 저장</span>
          </button>
        </div>
      </div>
      <span id="status" data-state="idle" data-i18n="statusIdle">대기</span>
      <button
        id="about"
        type="button"
        title="버전·라이선스·소스 코드"
        data-i18n="about"
        data-i18n-title="aboutTitle"
      >
        정보
      </button>
    </header>
    <div id="notice-bar" hidden></div>
    <main id="page-container"></main>
    <dialog id="app-dialog"></dialog>
    <details id="diag">
      <summary>M0 진단</summary>
      <pre id="diag-log"></pre>
      <button id="copy-diag" type="button">진단 결과 복사</button>
      <button id="bench-full-save" type="button" disabled title="파일은 저장하지 않는다">
        전체 저장 측정
      </button>
      <a id="open-bench" href="./bench.html" target="_blank">M5 벤치마크 페이지</a>
    </details>
    <script type="module" src="./src/viewer/main.ts"></script>
  </body>
</html>
